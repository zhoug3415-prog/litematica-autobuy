plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    maven { name = 'FallenBreath'; url = 'https://maven.fallenbreath.me/releases' }
    maven { name = 'Masa'; url = 'https://masa.dy.fi/maven' }
    maven { name = 'SakuraRyoko'; url = 'https://masa.dy.fi/maven/sakura-ryoko' }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "litematica-autobuy" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // 26.3 template and the printer build use plain implementation for mod jars.
    implementation "maven.modrinth:litematica:${project.litematica_version}"
    implementation "maven.modrinth:malilib:${project.malilib_version}"

    // Printer is optional at compile time because integration is reflection-only.
    // Put the actual jar in libs/ to load it in the dev client.
    def printerJar = file('libs/litematica-printer-1.1.3-hotfix.1+26.3.jar')
    if (printerJar.exists()) {
        modLocalRuntime files(printerJar)
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
